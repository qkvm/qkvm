# qKVM in a container:   docker compose up -d
#
# First run: open https://<this machine>:8787/ and choose a password using the setup
# code from `docker compose logs qkvm`. Verify the generated certificate on the host
# before trusting it in your browser, or install a certificate trusted by your clients.
# HTTPS and a setup code are required by this supplied deployment from the first request.
#
# To update:   docker compose pull && docker compose up -d
#
# This runs the published image. To run what is in this folder instead, build it under the
# same name first:   docker build -t qkvm/qkvm .
services:
  qkvm:
    image: qkvm/qkvm
    container_name: qkvm
    restart: unless-stopped
    ports:
      # host:container. Use "127.0.0.1:8787:8787" to reach it from this machine only.
      - "8787:8787"
    volumes:
      - qkvm-data:/data
      - qkvm-keys:/keys
    command: ["--https", "--setup-code"]
    #
    # /keys holds the independent server storage key. Back up this volume separately
    # from /data. Losing it prevents recovery; account recovery codes cannot replace it.
    # Existing installations require the offline --migrate-vault command before upgrade;
    # see SECURITY.md. Never mount a fresh empty key volume over an existing vault's key.
    # Run with as little as it needs.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # What qKVM prints (its warnings; the full log is the file in the data volume, which is kept to a size
    # by qKVM) is kept by Docker, and without an end unless it is given one.
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

volumes:
  qkvm-data:
  qkvm-keys:
